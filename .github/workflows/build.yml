name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/FarsiOrigin.Unrealizer/FarsiOrigin.Unrealizer.csproj

      - name: Build
        run: dotnet build src/FarsiOrigin.Unrealizer/FarsiOrigin.Unrealizer.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish src/FarsiOrigin.Unrealizer/FarsiOrigin.Unrealizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarsiOrigin-Unrealizer-win-x64
          path: publish/
          if-no-files-found: error
